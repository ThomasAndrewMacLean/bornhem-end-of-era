    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000;
        color: #fff;
        font-family: sans-serif;
        overflow: hidden;
        user-select: none;
      }
      #slideshow {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #slideshow img,
      #slideshow video {
        max-width: 100vw;
        max-height: 100vh;
        width: auto;
        height: auto;
        object-fit: contain;
        display: block;
      }
      #controls {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 16px;
        align-items: center;
        background: rgba(0, 0, 0, 0.5);
        padding: 10px 20px;
        border-radius: 40px;
        opacity: 0;
        transition: opacity 0.3s;
      }
      body:hover #controls {
        opacity: 1;
      }
      #controls button {
        background: rgba(255, 255, 255, 0.15);
        border: none;
        color: #fff;
        padding: 8px 18px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.2s;
      }
      #controls button:hover {
        background: rgba(255, 255, 255, 0.35);
      }
      #counter {
        font-size: 13px;
        opacity: 0.7;
        min-width: 70px;
        text-align: center;
      }
      #caption {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        opacity: 0.5;
        white-space: nowrap;
        max-width: 90vw;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0;
        transition: opacity 0.3s;
      }
      body:hover #caption {
        opacity: 0.5;
      }
      #prev-area,
      #next-area {
        position: fixed;
        top: 0;
        bottom: 0;
        width: 40%;
        cursor: pointer;
      }
      #prev-area {
        left: 0;
      }
      #next-area {
        right: 0;
      }
      :fullscreen #controls,
      :fullscreen #caption {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="slideshow"></div>
    <div id="caption"></div>

    <div id="prev-area"></div>

      ];
      let idx = 0;
      let playing = true;
      let timer = null;
      const INTERVAL = 6000;

      const box = document.getElementById("slideshow");
      const counter = document.getElementById("counter");
      const caption = document.getElementById("caption");
      const btnPlay = document.getElementById("btn-play");

      function show(i) {
        idx = (i + media.length) % media.length;
        const file = media[idx];
        const path = "End of an era/" + file;
        const isVideo = /\.(mp4|mov|webm)$/i.test(file);

        box.innerHTML = "";
        if (isVideo) {
          const v = document.createElement("video");
          v.src = path;
          v.autoplay = true;
          v.muted = true;
          v.loop = false;
          v.controls = true;
          v.onended = () => {
            if (playing) show(idx + 1);
          };
          box.appendChild(v);
        } else {
          const img = document.createElement("img");
          img.src = path;
          box.appendChild(img);
        }

        counter.textContent = idx + 1 + " / " + media.length;
        caption.textContent = file;

        clearTimeout(timer);
        if (playing && !isVideo) {
          timer = setTimeout(() => show(idx + 1), INTERVAL);
        }
      }

      function togglePlay() {
        playing = !playing;
        btnPlay.innerHTML = playing ? "&#10074;&#10074;" : "&#9654;";
        if (playing) show(idx);
        else clearTimeout(timer);
      }

      document.getElementById("btn-prev").onclick = () => {
        playing = false;
        btnPlay.innerHTML = "&#9654;";
        clearTimeout(timer);
        show(idx - 1);
      };
      document.getElementById("btn-next").onclick = () => {
        playing = false;
        btnPlay.innerHTML = "&#9654;";
        clearTimeout(timer);
        show(idx + 1);
      };
      document.getElementById("btn-play").onclick = togglePlay;
      document.getElementById("prev-area").onclick = () => {
        playing = false;
        btnPlay.innerHTML = "&#9654;";
        clearTimeout(timer);
        show(idx - 1);
      };
      document.getElementById("next-area").onclick = () => {
        playing = false;
        btnPlay.innerHTML = "&#9654;";
        clearTimeout(timer);
        show(idx + 1);
      };

      document.getElementById("btn-fs").onclick = () => {
        if (!document.fullscreenElement)
          document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      };

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === " ") {
          playing = false;
          btnPlay.innerHTML = "&#9654;";
          clearTimeout(timer);
          show(idx + 1);
        } else if (e.key === "ArrowLeft") {
          playing = false;
          btnPlay.innerHTML = "&#9654;";
          clearTimeout(timer);
          show(idx - 1);
        } else if (e.key === "p" || e.key === "P") togglePlay();
        else if (e.key === "f" || e.key === "F")
          document.getElementById("btn-fs").click();
      });

      show(0);
    </script>
